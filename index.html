}

<style>
/* Layout: one-screen tool — header strip with totals, list rail on the left, sea-chart map filling the rest; stacks map-over-list on phones */
:root{
  --sea:#d9e4ea; --land:#f6f7f4; --land-line:#9fb0ba; --neighbour:#eceeea;
  --bg:#f3f6f7; --panel:#ffffff; --fg:#14222c; --muted:#5b6d78; --line:#d5dee3;
  --accent:#0f6e8c; --accent-soft:#e1eff4; --warn:#a15c00; --warn-soft:#fdf1df;
  --g1:#0f6e8c; --g2:#c2410c; --g3:#4d7c0f; --g4:#7e3fb0; --g5:#b8860b; --g6:#be185d; --g7:#0d9488; --g8:#475569; --extra:#7a8a94;
  color-scheme:light;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.ttl{min-width:0}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 0;font:700 24px/1.1 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-left:auto}
.stat b{display:block;font:600 19px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
main{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr}
aside{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
.ctrl{display:grid;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
label.lbl{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
select,input[type=search]{width:100%;box-sizing:border-box;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
.legend{display:grid;gap:3px;padding:10px 14px;border-bottom:1px solid var(--line)}
.lg{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;font-size:13px;padding:3px 4px;border-radius:5px;cursor:pointer;border:0;background:none;color:inherit;text-align:left;font-family:inherit}
.lg:hover{background:var(--accent-soft)}
.lg.off{opacity:.38}
.lg .sw{width:12px;height:12px;border-radius:50%}
.lg .n,.lg .k{font:12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.lg .k{min-width:72px;text-align:right}
.list{overflow:auto;flex:1;min-height:0}
.item{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left}
.item:hover,.item.on{background:var(--accent-soft)}
.item .no{font:12px var(--f-mono);color:var(--muted);text-align:right}
.item .nm{min-width:0}
.item .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .kw{font:12px var(--f-mono);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ind{background:transparent!important;border:2px dashed currentColor;width:7px;height:7px}
.tag{font:500 10px/1 var(--f-mono);padding:3px 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn);letter-spacing:.03em}
.notes{padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px}
.notes summary{cursor:pointer;font-weight:600;color:var(--warn)}
.notes ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;color:var(--fg)}
#map{min-width:0;min-height:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:var(--f-body)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.leaflet-popup-content{margin:12px 14px;min-width:230px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-bar a{background:var(--panel);color:var(--fg);border-color:var(--line)}
.leaflet-bar a:hover{background:var(--accent-soft)}
.pp h3{margin:0 0 2px;font:700 17px/1.15 var(--f-display)}
.pp .loc{color:var(--muted);font-size:12px;margin-bottom:8px}
.pp table{border-collapse:collapse;width:100%;font-size:12.5px}
.pp td{padding:3px 0;border-bottom:1px solid var(--line)}
.pp td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pp .pk{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.pp .pk span{font:11px var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--accent-soft)}
.pp .fl{margin-top:8px;padding:6px 8px;border-radius:5px;background:var(--warn-soft);color:var(--warn);font-size:12px}
.pp .co{margin-top:6px;font:11px var(--f-mono);color:var(--muted)}
.lbl-site{background:none;border:0;box-shadow:none;font:600 11px var(--f-body);color:var(--fg);text-shadow:0 0 3px var(--sea),0 0 3px var(--sea),0 0 2px var(--sea)}
.lbl-site::before{display:none}
.on-sat .lbl-site{color:#fff;text-shadow:0 0 3px #000,0 0 2px #000,0 0 1px #000}
.on-sat .leaflet-interactive[stroke-dasharray="4 3"]{}
#tilemsg.err{background:#fde2e2;color:#9b1c1c}
#tilemsg{position:absolute;z-index:500;left:50%;transform:translateX(-50%);top:10px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:6px;font-size:12px;max-width:80%}
@media (max-width:760px){
  body{overflow:auto}
  main{grid-template-columns:1fr;grid-template-rows:58vh auto}
  #map{grid-row:1}
  aside{grid-row:2;border-right:0}
  .list{max-height:none;overflow:visible}
  .stats{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const fmt=(v,d=0)=>Number(v||0).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=[], EXTRA=[], SKIP=[];
let grp='wil', hidden=new Set(), q='', showLbl=false;

// Angka: terima "1135.2", "1135,2", "1.135,2", "1,135.2"
function num(v){
  if(v===null||v===undefined)return NaN;
  let s=String(v).trim().replace(/\s/g,'');
  if(s==='')return NaN;
  const c=s.lastIndexOf(','),d=s.lastIndexOf('.');
  if(c>-1&&d>-1){ s= c>d ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(c>-1){ s=s.replace(',','.'); }
  return Number(s);
}
// Nama kolom: abaikan huruf besar/kecil, spasi, dan tanda baca
const key=h=>String(h||'').toLowerCase().replace(/^﻿/,'').replace(/[^a-z0-9]/g,'');
function pick(r,...names){for(const n of names){const v=r[key(n)];if(v!==undefined&&String(v).trim()!=='')return String(v).trim();}return '';}
async function loadCSV(path){
  const res=await fetch(path+'?v='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw new Error(path+' tidak ditemukan ('+res.status+')');
  const txt=await res.text();
  const out=Papa.parse(txt,{header:true,skipEmptyLines:'greedy',transformHeader:key});
  return out.data;
}

function toSite(r,i){
  const lat=num(pick(r,'lat','latitude')),lon=num(pick(r,'lon','longitude','long'));
  const nama=pick(r,'nama','lokasi','dusun');
  const baris=i+2;
  if(!nama){SKIP.push(`Baris ${baris}: kolom nama kosong`);return null;}
  if(!isFinite(lat)||!isFinite(lon)||lat<-12||lat>7||lon<94||lon>142){SKIP.push(`Baris ${baris} (${nama}): koordinat tidak valid (lat "${pick(r,'lat')}", lon "${pick(r,'lon')}")`);return null;}
  const no=num(pick(r,'no'));
  return {no:isFinite(no)?no:i+1,nama,prov:pick(r,'provinsi'),kab:pick(r,'kabupaten'),kec:pick(r,'kecamatan'),desa:pick(r,'desa'),config:pick(r,'config'),unit:pick(r,'unit'),
    wil:pick(r,'wilayah')||'(tanpa wilayah)',lat,lon,src:pick(r,'sumber_koordinat','sumber')||'-',
    kwp:num(pick(r,'pv_kwp','kwp'))||0,kwh:num(pick(r,'bess_kwh','kwh'))||0,capel:num(pick(r,'capel'))||0,
    jtm:num(pick(r,'jtm_kms'))||0,jtr:num(pick(r,'jtr_kms'))||0,klu:pick(r,'kluster')||'-',
    opsi:[1,2,3,4,5].map(k=>pick(r,'opsi'+k)||'-'),flag:pick(r,'catatan')};
}
const isKMZ=s=>s.src.toUpperCase()==='KMZ';

// ===== Grup & warna =====
const uniq=a=>[...new Set(a)];
function groupOf(s){
  if(grp==='wil')return s.wil;
  if(grp==='klu')return 'Kluster '+s.klu;
  return 'Paket '+s.opsi[+grp[1]];
}
function groups(){
  const order=['Sumatera-Kepri','Sulawesi','Maluku-Malut-NTT','Papua'];
  const g=uniq(S.map(groupOf));
  return g.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);
    if(ia>-1||ib>-1)return (ia<0?99:ia)-(ib<0?99:ib);
    return a.localeCompare(b,'id',{numeric:true});});
}
function colorOf(g){const i=groups().indexOf(g);return css('--g'+((i%8)+1));}

// ===== Peta =====
// Citra Esri di lokasi terpencil sering hanya tersedia sampai zoom 16-17.
// Di atas level ini citra diperbesar dari level SAT_MAX agar tidak muncul 'Map data not yet available'.
const SAT_MAX=16;
const map=L.map('map',{zoomSnap:.25,maxZoom:20,attributionControl:true}).setView([-2.5,118],5);
const baseLand=L.geoJSON(BASE,{interactive:false,attribution:'Garis pantai: Natural Earth',style:f=>({color:css('--land-line'),weight:.7,fillColor:f.properties.name==='Indonesia'?css('--land'):css('--neighbour'),fillOpacity:1})});
const tiles={
  osm:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap contributors'}),
  sat:L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:SAT_MAX,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:SAT_MAX})
  ])
};
let tileErr=0;
const onErr=()=>{if(++tileErr===3)fallback()};
tiles.osm.on('tileerror',onErr);tiles.sat.eachLayer(l=>l.on('tileerror',onErr));
function fallback(){const sel=document.getElementById('base');if(sel.value==='none')return;sel.value='none';setBase('none');msg('Citra satelit/OSM tidak bisa dimuat, jadi peta beralih ke garis pantai.');}
function msg(t,isErr){let d=document.getElementById('tilemsg');if(!d){d=document.createElement('div');d.id='tilemsg';document.getElementById('map').appendChild(d);}d.textContent=t;d.classList.toggle('err',!!isErr);}
function setBase(v){
  Object.values(tiles).forEach(t=>map.removeLayer(t));tileErr=0;
  if(v==='none'){baseLand.addTo(map);baseLand.bringToBack();}
  else{map.removeLayer(baseLand);tiles[v].addTo(map);}
  document.getElementById('map').classList.toggle('on-sat',v==='sat');
}
document.getElementById('base').onchange=e=>{document.getElementById('tilemsg')?.remove();setBase(e.target.value);};
setBase(document.getElementById('base').value);

const lahanLayer=L.layerGroup().addTo(map);
const extraLayer=L.layerGroup();
const siteLayer=L.featureGroup().addTo(map);
let markers=[];
const rad=s=>4+Math.sqrt(Math.max(s.kwp,0))/3.2;

function popup(s){
  const pk=s.opsi.map((p,i)=>`<span title="${OPSI[i]}">O${i+1}: P${esc(p)}</span>`).join('');
  return `<div class="pp"><h3>${esc(s.no)}. ${esc(s.nama)}</h3>
  <div class="loc">${[s.desa&&s.desa!==s.nama?'Desa '+s.desa:'',s.kec,s.kab,s.prov].filter(Boolean).map(esc).join(', ')}${s.unit?' · '+esc(s.unit):''}</div>
  <table>
   <tr><td>PV</td><td>${fmt(s.kwp,1)} kWp</td></tr>
   <tr><td>BESS</td><td>${fmt(s.kwh,1)} kWh</td></tr>
   <tr><td>Calon pelanggan</td><td>${fmt(s.capel)}</td></tr>
   <tr><td>JTM / JTR</td><td>${fmt(s.jtm,2)} / ${fmt(s.jtr,2)} kms</td></tr>
   <tr><td>Kluster</td><td>${esc(s.klu)}</td></tr>
   <tr><td>Wilayah</td><td>${esc(s.wil)}</td></tr>
   ${s.config?`<tr><td>Config</td><td>${esc(s.config)}</td></tr>`:''}
  </table>
  <div class="pk">${pk}</div>
  ${s.flag?`<div class="fl">${esc(s.flag)}</div>`:''}
  <div class="co">${s.lat.toFixed(5)}, ${s.lon.toFixed(5)} · sumber koordinat: ${esc(s.src)}</div></div>`;
}
function visible(s){
  if(hidden.has(groupOf(s)))return false;
  if(!q)return true;
  return [s.nama,s.desa,s.kab,s.prov,s.kec,s.unit].join(' ').toLowerCase().includes(q);
}
function refresh(){
  markers.forEach(m=>{
    const s=m.site,c=colorOf(groupOf(s)),v=visible(s),k=isKMZ(s);
    m.setStyle({color:k?'#ffffff':c,fillColor:c,fillOpacity:k?.9:.25,dashArray:k?null:'3 2',weight:k?1.5:2});
    if(v&&!siteLayer.hasLayer(m))siteLayer.addLayer(m);
    if(!v&&siteLayer.hasLayer(m))siteLayer.removeLayer(m);
    if(showLbl)m.openTooltip();else m.closeTooltip();
  });
  document.getElementById('nLok').textContent=S.length;
  const tot=k=>S.reduce((a,s)=>a+(+s[k]||0),0);
  document.getElementById('stats').innerHTML=[
    [S.length,'lokasi'],[fmt(tot('kwp'),1),'kWp PV'],[fmt(tot('kwh')/1000,1),'MWh BESS'],[fmt(tot('capel')),'calon pelanggan']
  ].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  const gs=groups();
  document.getElementById('legend').innerHTML=gs.map(g=>{
    const ss=S.filter(s=>groupOf(s)===g);
    return `<button class="lg ${hidden.has(g)?'off':''}" data-g="${esc(g)}" title="Klik untuk sembunyikan/tampilkan">
      <span class="sw" style="background:${colorOf(g)}"></span><span>${esc(g)}</span>
      <span class="n">${ss.length} lok</span><span class="k">${fmt(ss.reduce((a,s)=>a+s.kwp,0),1)} kWp</span></button>`;
  }).join('')+(S.some(s=>!isKMZ(s))?`<div class="lg" style="cursor:default"><span class="sw" style="border:2px dashed var(--muted);width:8px;height:8px"></span><span style="color:var(--muted)">Koordinat indikatif / bukan KMZ</span><span></span><span></span></div>`:'');
  document.querySelectorAll('.lg[data-g]').forEach(b=>b.onclick=()=>{const g=b.dataset.g;hidden.has(g)?hidden.delete(g):hidden.add(g);refresh();});
  const vis=S.filter(visible);
  document.getElementById('list').innerHTML=vis.map((s,i)=>`<button class="item" data-i="${S.indexOf(s)}">
    <span class="no">${esc(s.no)}</span>
    <span class="nm"><b>${esc(s.nama)}</b><small>${[s.kab,s.prov].filter(Boolean).map(esc).join(', ')}</small></span>
    <span class="kw">${s.flag?'<span class="tag">CEK</span>':''}${fmt(s.kwp,1)}<span class="dot ${isKMZ(s)?'':'ind'}" style="background:${colorOf(groupOf(s))};color:${colorOf(groupOf(s))}"></span></span></button>`).join('')
    || '<div style="padding:14px;color:var(--muted)">Tidak ada lokasi yang cocok.</div>';
  document.querySelectorAll('.item').forEach(b=>b.onclick=()=>focusSite(+b.dataset.i));
}
function hl(i){document.querySelectorAll('.item').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
  const el=document.querySelector(`.item[data-i="${i}"]`);el&&el.scrollIntoView({block:'nearest'});}
function focusSite(i){const m=markers[i];map.flyTo(m.getLatLng(),12,{duration:.8});setTimeout(()=>m.openPopup(),850);hl(i);}

function notes(){
  const ind=S.filter(s=>!isKMZ(s)).map(s=>s.nama);
  const fl=S.filter(s=>s.flag).length;
  const items=[];
  if(SKIP.length)items.push(`<b>${SKIP.length} baris di lokasi.csv tidak ditampilkan:</b><br>${SKIP.map(esc).join('<br>')}`);
  if(ind.length)items.push(`${ind.length} lokasi memakai koordinat bukan dari KMZ: ${ind.map(esc).join(', ')}.`);
  if(fl)items.push(`${fl} lokasi punya catatan (ditandai CEK). Klik lokasinya untuk membaca catatan.`);
  if(EXTRA.length)items.push(`${EXTRA.length} titik di KMZ tidak tercantum di daftar: ${EXTRA.map(e=>esc(e.nama)).join(', ')}. Aktifkan "Titik KMZ di luar daftar" untuk melihatnya.`);
  items.push(`Data dibaca dari ${FILE_LOKASI}. Nilai RAB/pagu tidak dimuat.`);
  document.getElementById('notesList').innerHTML=items.map(t=>`<li>${t}</li>`).join('');
  if(SKIP.length)document.getElementById('notes').open=true;
}

async function init(){
  document.getElementById('list').innerHTML='<div style="padding:14px;color:var(--muted)">Memuat data lokasi…</div>';
  try{
    const rows=await loadCSV(FILE_LOKASI);
    S=rows.map(toSite).filter(Boolean);
  }catch(e){
    const local=location.protocol==='file:';
    const t=local?'Data CSV tidak bisa dibaca karena halaman dibuka langsung dari file di komputer. Buka lewat link GitHub Pages.':'Gagal memuat '+FILE_LOKASI+': '+e.message;
    msg(t,true);document.getElementById('list').innerHTML=`<div style="padding:14px;color:var(--warn)">${esc(t)}</div>`;return;
  }
  markers=S.map((s,i)=>{
    const m=L.circleMarker([s.lat,s.lon],{radius:rad(s)});
    m.bindPopup(()=>popup(s),{maxWidth:300});
    m.bindTooltip(esc(s.nama),{permanent:true,direction:'right',offset:[rad(s)+2,0],className:'lbl-site'});
    m.on('click',()=>hl(i));m.site=s;return m;
  });
  markers.forEach(m=>siteLayer.addLayer(m));
  if(markers.length)map.fitBounds(siteLayer.getBounds(),{padding:[24,24]});
  refresh();notes();
  // data pelengkap (tidak wajib ada)
  try{
    const ex=await loadCSV(FILE_LUAR);
    EXTRA=ex.map(r=>({nama:pick(r,'nama'),lat:num(pick(r,'lat')),lon:num(pick(r,'lon')),ket:pick(r,'keterangan')})).filter(e=>e.nama&&isFinite(e.lat)&&isFinite(e.lon));
    EXTRA.forEach(e=>extraLayer.addLayer(L.circleMarker([e.lat,e.lon],{radius:5,color:css('--extra'),weight:2,fillColor:css('--extra'),fillOpacity:.35})
      .bindPopup(`<div class="pp"><h3>${esc(e.nama)}</h3><div class="loc">${esc(e.ket)}</div><div class="co">${e.lat.toFixed(5)}, ${e.lon.toFixed(5)}</div></div>`)));
    notes();
  }catch(e){}
  try{
    const res=await fetch(FILE_LAHAN+'?v='+Date.now(),{cache:'no-store'});
    if(res.ok){const gj=await res.json();
      L.geoJSON(gj,{style:{color:'#ffd23f',weight:2.5,dashArray:'4 3',fill:false},onEachFeature:(f,l)=>l.bindTooltip(esc(f.properties?.nama||'Lahan'))}).eachLayer(l=>lahanLayer.addLayer(l));}
  }catch(e){}
}

document.getElementById('grp').onchange=e=>{grp=e.target.value;hidden.clear();refresh();};
document.getElementById('q').oninput=e=>{q=e.target.value.trim().toLowerCase();refresh();};
document.getElementById('cLbl').onchange=e=>{showLbl=e.target.checked;refresh();};
document.getElementById('cLahan').onchange=e=>e.target.checked?lahanLayer.addTo(map):map.removeLayer(lahanLayer);
document.getElementById('cExtra').onchange=e=>e.target.checked?extraLayer.addTo(map):map.removeLayer(extraLayer);
init();
</script>
</body>
</html>
